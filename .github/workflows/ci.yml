name: CI

# Runs the package's own tests on every push and pull request, in the package's own directory,
# exactly as a consumer would run them.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Zero dependencies is a claim worth testing on every platform, not asserting.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 20.15 is the real floor, not 18.
        #
        # `util/unzip.mjs` imports `crc32` from `node:zlib`, added in v20.15.0 and v22.2.0. On Node 18 that import is
        # undefined and every ZIP-based format — DOCX, XLSX, PPTX — throws. The matrix used to include "18", which was
        # testing a version the code cannot support, and it could not catch the problem because a separate glob failure
        # aborted the run before any test executed.
        #
        # "22" is pinned to a patch above 22.2.0 for the same reason: v22.0 and v22.1 predate crc32.
        node: ["20.15", "22.2", "22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Confirm there is nothing to install
        run: node -e "const p=require('./package.json');if(p.dependencies&&Object.keys(p.dependencies).length){console.error('runtime dependencies found');process.exit(1)}console.log('zero runtime dependencies')"

      # The floor is verified rather than declared: if crc32 is missing, the engines range is wrong and every ZIP format
      # is broken on this version. Cheaper to fail here with a clear message than inside a reader.
      - name: Verify the declared engine floor holds
        run: node -e "import('node:zlib').then(z=>{if(typeof z.crc32!=='function'){console.error('zlib.crc32 missing - engines range is wrong for '+process.version);process.exit(1)}console.log('zlib.crc32 present on '+process.version)})"

      - run: npm test

      # Documentation drift is a bug. `check-claims` verifies the README against the code; `check-docs` sweeps every document
      # for figures that were true once and are not now — the failure mode being a reader who believes a number nobody
      # updated. Between them they have caught the platform count, an engines range the code could not honour, and a sample
      # output showing a note format the tool no longer produces.
      - name: Verify the README's claims against the code
        run: npm run check-claims

      - name: Verify every document against the current code
        run: npm run check-docs

      # The benchmark measures FIDELITY, not just ratio: every corpus declares needles that must survive, and a lost needle
      # fails the build. A 100% saving that drops the one failing test is a bug, not a win — and this check has already found
      # three real bugs, including a note that claimed nothing was removed while a third of the rows had been dropped.
      - name: Benchmark, including the fidelity check
        run: npm run benchmark

      # The check that caught a real packaging bug: `exports` exposed only the entry point, so every other module was
      # unreachable from an installed package while all 379 tests passed in the repository.
      - name: Verify the published package works when installed
        run: npm run smoke
